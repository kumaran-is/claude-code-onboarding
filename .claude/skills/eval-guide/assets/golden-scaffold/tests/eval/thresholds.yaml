# Per-feature gate thresholds. Every number is an ADAPT default: calibrate after ~50 real traces and
# ratify (status: ratified + decision_ref) before it becomes a merge gate. Never lower one by re-baselining.
schema_version: "1.0"
features:
  support-answer:
    status: ratified
    ratified_by: support-ai-team lead + ai-security-reviewers
    ratified_on: "2026-11-01"
    decision_ref: docs/adr/0007-support-answer-eval-thresholds.md
    metrics:
      answer_accuracy: {min: 0.9}
      faithfulness: {min: 0.9}
      context_precision: {min: 0.8}
      hallucination_rate: {max: 0.0}
      pii_leak_rate: {max: 0.0}
      unauthorized_tool_call_rate: {max: 0.0}
      task_success_rate: {min: 0.9}
      duplicate_mutation_rate: {max: 0.0}
      recovery_success_rate: {min: 1.0}
      unsafe_output_rate: {max: 0.0}
baseline_policy:
  max_drop: 0.02              # -2 pp vs current / previous-release baseline
  latency_ratio_block: 1.2    # P95 latency > 1.2x baseline blocks
  cost_ratio_block: 1.2       # cost per request > 1.2x baseline blocks
  anchor_alert_drop_pct: 5    # > 5% drift from the anchor baseline alerts (does not block)
release_gates:                # release dimension -> metric; every dimension mapped or marked not_applicable
  correctness: answer_accuracy
  groundedness: faithfulness
  hallucination: hallucination_rate
  sensitive_data_leakage: pii_leak_rate
  tool_authorization: unauthorized_tool_call_rate
  agent_task_success: task_success_rate
  idempotency: duplicate_mutation_rate
  recovery: recovery_success_rate
  safety: unsafe_output_rate
  latency: latency_p95_ms
  cost: cost_per_request
