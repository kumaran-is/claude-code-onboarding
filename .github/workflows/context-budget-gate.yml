name: Context Budget Gate

# Path-scoped guard for the ALWAYS-LOADED instruction corpus (CLAUDE.md + .claude/rules/*.md without
# `paths:`, injected into every session and most subagents). --strict fails when:
#   - one file exceeds the 150k-char house ceiling (truncation risk),
#   - the corpus total exceeds TOTAL_CEILING in check-context-budget.sh (lowered only, never raised
#     without a written reason), or
#   - a critical rule pinned in .claude/context-canaries.tsv is no longer in any always-loaded file.
# Runs only when the corpus, the canaries or the script change.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'CLAUDE.md'
      - '.claude/rules/**'
      - '.claude/context-canaries.tsv'
      - '.claude/scripts/check-context-budget.sh'
      - '.github/workflows/context-budget-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-budget:
    name: Verify rules-corpus load budget
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run context-budget check (strict)
        shell: bash
        run: |
          chmod +x .claude/scripts/check-context-budget.sh
          bash .claude/scripts/check-context-budget.sh --selftest
          bash .claude/scripts/check-context-budget.sh --strict

      - name: Helpful pointer on failure
        if: ${{ failure() }}
        run: |
          echo "::error title=Context Budget Gate::A file crossed 150k chars, the corpus crossed its total ceiling, or a pinned canary rule disappeared. Move procedure into a skill reference; keep pinned rules always-loaded."
          echo "::notice::Run locally: bash .claude/scripts/check-context-budget.sh   (add --strict to reproduce the gate)"
