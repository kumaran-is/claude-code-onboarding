name: Toolkit Lint

# Gates the toolkit's own assets (skills, agents, commands, rules, hooks, scripts, docs) with the
# same scripts contributors run locally. Each step reads the tool's own exit code; there is no
# `|| true` on any gate. Runs only when those assets change.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'docs/**'
      - '.github/workflows/toolkit-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint skills, agents, commands, testing-tool routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Skills
        run: bash .claude/scripts/lint-skills.sh

      - name: Agents
        run: bash .claude/scripts/lint-agents.sh

      - name: Commands
        run: bash .claude/scripts/lint-commands.sh

      - name: Testing-tool routing
        run: bash .claude/scripts/lint-testing-tools.sh

  hooks:
    name: Hook and script syntax + selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Shell syntax (bash -n)
        run: |
          failed=0
          checked=0
          for f in .claude/hooks/*.sh .claude/scripts/*.sh; do
            checked=$((checked + 1))
            if ! bash -n "$f"; then echo "::error file=$f::bash -n failed"; failed=$((failed + 1)); fi
          done
          echo "checked=$checked failed=$failed"
          [ "$checked" -gt 0 ] || { echo "::error::no shell files found"; exit 1; }
          [ "$failed" -eq 0 ]

      - name: Selftests (every hook/script that declares --selftest)
        run: |
          failed=0
          ran=0
          for f in $(grep -l -- '--selftest' .claude/hooks/* .claude/scripts/*); do
            ran=$((ran + 1))
            rc=0
            case "$f" in
              *.py) python3 "$f" --selftest > selftest.log 2>&1 || rc=$? ;;
              *)    bash "$f" --selftest > selftest.log 2>&1 || rc=$? ;;
            esac
            echo "$f exit=$rc"
            if [ "$rc" -ne 0 ]; then cat selftest.log; echo "::error file=$f::selftest exit $rc"; failed=$((failed + 1)); fi
          done
          echo "ran=$ran failed=$failed"
          [ "$ran" -gt 0 ] || { echo "::error::no selftests discovered"; exit 1; }
          [ "$failed" -eq 0 ]
